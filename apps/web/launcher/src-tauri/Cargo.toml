[package]
name = "dsh-web-launcher"
version = "0.1.0"
description = "Standalone Tauri GUI for managing the dsh web dev server lifecycle"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = ["config-toml"] }

[dependencies]
tauri = { version = "2.0", features = ["config-toml", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "sync", "time", "macros", "rt-multi-thread", "net"] }
chrono = { version = "0.4", features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lib]
name = "dsh_web_launcher_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dsh-web-launcher"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
