product-name = "dsh-web-launcher"
version = "0.1.0"
identifier = "com.deepseek.harness.web-launcher"
main-binary-name = "dsh-web-launcher"

[build]
dev-url = "http://localhost:5173"
frontend-dist = "../dist"
before-dev-command = "npm run dev"
before-build-command = "npm run build"

[app]
with-global-tauri = true

[[app.windows]]
url = "index.html"
label = "main"
width = 600
height = 480
min-width = 600
min-height = 480
max-width = 600
max-height = 480
resizable = false
fullscreen = false
maximized = false
minimizable = false
center = true
skip-taskbar = false
title = "DSH 启动器"
decorations = false
shadow = true
visible = false
transparent = false
drag-drop-enabled = false

[app.security]
csp = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:3080"

[bundle]
targets = "msi"
icon = ["../public/appicon-512.png", "../public/appicon.ico"]
