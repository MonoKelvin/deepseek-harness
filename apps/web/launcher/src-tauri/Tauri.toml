product-name = "dsh-web-launcher"
version = "../package.json"
identifier = "com.deepseek.harness.web-launcher"
main-binary-name = "dsh-web-launcher"

[build]
dev-url = "http://localhost:5173"
frontend-dist = "../dist"
before-dev-command = "npm run dev"
before-build-command = "npm run build"

[app]
with-global-tauri = true

[[app.windows]]
url = "index.html"
label = "main"
# The window is 60px larger than the 600x480 content on each axis: the launcher
# draws its own rounded corners and drop shadow in CSS (see src/index.css), and
# this 30px transparent gutter on every side is where that shadow renders.
width = 660
height = 540
min-width = 660
min-height = 540
max-width = 660
max-height = 540
resizable = false
fullscreen = false
maximized = false
minimizable = false
center = true
skip-taskbar = false
title = "DSH 启动器"
decorations = false
# No native shadow or rounded corners: a transparent window lets one CSS corner
# radius look identical on Windows 10 (no native rounding) and Windows 11, and
# the CSS shadow replaces the lost native one.
shadow = false
visible = false
transparent = true
drag-drop-enabled = false

[app.security]
csp = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"

[bundle]
targets = "msi"
icon = ["../public/appicon-512.png", "../public/appicon.ico"]
